spring.application.name=demo

# ---------------------------------------------------------------
# Conexao com o SQL Server (tabelas criadas por arEcologico.sql)
# Os valores podem ser trocados pelas variaveis de ambiente
# DB_URL, DB_USERNAME e DB_PASSWORD. A senha NAO fica neste arquivo.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=teste1;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:ar_app}
spring.datasource.password=${DB_PASSWORD:}

# O banco e criado pelo script SQL (fonte da verdade).
# "validate" faz o Hibernate conferir, ao subir, se as entidades batem com as tabelas
# e falhar caso nao batam. Use DB_DDL_AUTO=update apenas em banco de testes.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
# No SQL Server, a leitura agrupada de metadados ("grouped", padrao do Hibernate) nao
# encontra as tabelas e a validacao falha com "missing table". Ler tabela a tabela resolve.
spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually

# Mantem a sessao aberta durante a requisicao para serializar relacoes LAZY no JSON.
spring.jpa.open-in-view=true

# Mostra o SQL gerado no console (util para depurar). Troque para true se precisar.
spring.jpa.show-sql=false
